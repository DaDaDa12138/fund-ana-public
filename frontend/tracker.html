<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>跟踪清单 - Fund-ANA</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=1.9.783" />
  </head>
  <body class="layout-wide page-tracker">
    <div class="dashboard-app">
      <header class="site-header">
        <div class="site-shell">
          <a class="site-brand" href="/">
            <span class="site-brand-mark">FA</span>
            <span class="site-brand-copy">
              <strong>Fund-ANA</strong>
              <small>Bond Fund Screening</small>
            </span>
          </a>
          <nav class="page-nav page-nav-top">
            <a href="/">总览</a>
            <a href="/recommendations">推荐</a>
            <a href="/favorites">收藏</a>
            <a href="/tracker" class="active" aria-current="page">跟踪</a>
            <a href="/reports">文件</a>
            <a href="/task-summary">任务</a>
            <a href="/operations">运行</a>
            <a href="/api-settings">接口设置</a>
          </nav>
        </div>
      </header>

      <section class="page-hero">
        <div class="page-hero-shell">
          <div class="page-hero-main">
            <div class="eyebrow">Final Tracker</div>
            <h1>累积跟踪</h1>
            <p>在榜与留痕</p>
            <div class="page-hero-actions">
              <a class="preview-link" href="/recommendations">查看推荐</a>
              <a id="trackerPagePreviewBtn" class="preview-link" href="#" target="_blank" rel="noreferrer">预览跟踪表</a>
              <a id="trackerPageDownloadBtn" class="download-link" href="#" target="_blank" rel="noreferrer">下载跟踪表</a>
            </div>
          </div>
          <aside class="page-hero-side">
            <div class="hero-badge-stack">
              <div id="trackerHeaderRunBadge" class="status-badge">
                <span class="status-dot"></span>
                <span>状态检测中…</span>
              </div>
              <div id="trackerHeaderHealthBadge" class="version-badge">数据源检测中…</div>
            </div>
            <details class="compact-disclosure hero-details"><summary>发布详情</summary><div id="trackerHeroMeta" class="hero-meta-card"></div></details>
          </aside>
        </div>
      </section>

      <main class="dashboard-main">
        <section class="card card-emphasis">
          <div class="card-title-row">
            <div>
              <div class="card-title">跟踪摘要</div>
              <div id="trackerPageMeta" class="card-subtitle">正在加载…</div>
            </div>
          </div>
          <div id="trackerPageStats" class="stats-grid stats-grid-compact"></div>
          <details class="compact-disclosure summary-context-details">
            <summary>成员口径与来源</summary>
            <div id="trackerPageNarrative" class="info-banner"></div>
          </details>
        </section>

        <details class="compact-disclosure card-disclosure">
          <summary>在榜概览与集中度</summary>
          <div id="trackerPageHighlights" class="tracker-highlight-grid"></div>
        </details>

        <section class="card page-section-anchor page-list-surface" id="trackerCurrentList">
          <div class="card-title-row">
            <div>
              <div class="card-title">在榜基金列表</div>
              <div class="card-subtitle">筛选 / 风格 / 评分</div>
            </div>
          </div>
          <div class="list-summary-stack">
            <div id="trackerFilterBar" class="recommendation-filter-bar tracker-filter-bar"></div>
            <div id="trackerViewBar" class="favorite-view-bar"></div>
            <details class="compact-disclosure list-context-details">
              <summary>当前口径与列表提示</summary>
              <div id="trackerStyleThresholdSummary" class="favorite-threshold-overview"></div>
              <div id="trackerListHints" class="active-filter-list recommendation-list-hints"></div>
            </details>
          </div>
          <div class="tracker-controls-row">
            <div class="hero-actions tracker-primary-actions">
              <button id="trackerValuationBtn" type="button" class="secondary">补估值</button>
            </div>
            <div class="tracker-secondary-controls">
              <div id="trackerGroupSwitch" class="segmented-switch" aria-label="当前在榜分组切换"></div>
              <div class="score-tooltip" tabindex="0">
                <button type="button" class="score-tooltip-trigger" aria-controls="globalFloatingTooltip" aria-expanded="false">评分</button>
                <div id="scoreTooltipCard" class="score-tooltip-card" role="tooltip">
                  <p>评分以当前后端契约为准；缺失指标不补伪零。</p>
                  <div id="trackerFormalScoreContract">
                    <p>评分契约将在数据加载后显示。</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div id="trackerValuationBanner" class="subtle-panel tracker-valuation-banner">
            <strong>实时估值</strong>
            <span>点击后补估值</span>
          </div>
          <div id="trackerPageTable" class="table-shell"></div>
        </section>
      </main>
    </div>
    <script src="/shared.js?v=1.9.783"></script>
    <script src="/version-widget.js?v=1.9.783"></script>
    <script src="/tracker.js?v=1.9.783"></script>
  </body>
</html>
