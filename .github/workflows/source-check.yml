name: Source Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  TZ: Asia/Shanghai
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check Python source syntax
        run: python -m compileall -q backend core scripts tests
      - name: Check JavaScript syntax
        run: find frontend deploy tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run source-only frontend regression tests
        run: node --test tests/*.test.js
