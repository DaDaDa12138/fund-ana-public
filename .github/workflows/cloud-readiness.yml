name: Cloud Runner Readiness
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TZ: Asia/Shanghai
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check ephemeral disk and public upstream connectivity
        run: |
          df -h / /mnt
          docker image prune -af
          docker builder prune -af
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /usr/local/lib/node_modules /usr/local/share/boost /usr/lib/jvm /usr/local/julia* /usr/share/miniconda /opt/az /usr/local/aws-cli /usr/share/gradle* /usr/share/maven
          df -h / /mnt
          docker build -t fund-ana-tiantian:cloud deploy/tiantian-api
          docker run -d --name tiantian-api -e TZ=Asia/Shanghai -p 127.0.0.1:3000:3000 fund-ana-tiantian:cloud
          sleep 5
          python3 - <<'PY'
          import json,urllib.error,urllib.request,urllib.parse
          requests=[
            ('http://127.0.0.1:3000/healthz',None),
            ('http://127.0.0.1:3000/fundMNRank?FundType=31&pageIndex=1&pageSize=1',None),
            ('http://127.0.0.1:3000/fundMNRank?FundType=32&pageIndex=1&pageSize=1',None),
            ('http://127.0.0.1:3000/fundMNHisNetList?FCODE=100066&pageIndex=1&pageSize=3',None),
            ('https://fundcomapi.eastmoney.com/mm/newCore/FundValuationLast',{'FCODES':'100066','FIELDS':'FCODE,NAV,PDATE,SYL_1N'}),
            ('https://fundmobapi.eastmoney.com/FundMNewApi/FundMNFInfo?Fcodes=100066&plat=Android&deviceid=fund-ana&product=EFund&Version=6.6.8&appType=ttjj&pageIndex=1&pageSize=1',None),
          ]
          errors=[]
          for url,data in requests:
            try:
              req=urllib.request.Request(url,data=urllib.parse.urlencode(data).encode() if data else None,headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/x-www-form-urlencoded','Referer':'https://h5.1234567.com.cn/'})
              with urllib.request.urlopen(req,timeout=45) as r:
                body=r.read();value=json.loads(body)
                rows=value.get('Datas') or value.get('data')
                parsed=urllib.parse.urlparse(url)
                print(parsed.netloc,parsed.path,parsed.query if parsed.path == '/fundMNRank' else '',r.status,len(body),'rows',len(rows) if isinstance(rows,list) else None)
                if parsed.path == '/fundMNRank':
                  if not (value.get('Success') is True and value.get('ErrCode') == 0 and isinstance(rows,list) and len(rows) == 1 and type(value.get('TotalCount')) is int and value['TotalCount'] > 0):
                    errors.append(parsed.path)
                elif 'healthz' not in url and not rows:
                  errors.append(parsed.path)
            except urllib.error.HTTPError as e:
              try: failure=json.load(e)
              except (ValueError,OSError): failure={}
              print(urllib.parse.urlparse(url).path,e.code,e.headers.get('X-Request-ID'),(failure.get('error') or {}).get('code'))
              errors.append(url)
            except Exception as e:print(type(e).__name__,str(e));errors.append(url)
          if errors:raise RuntimeError('upstream_business_preflight_failed')
          PY
      - name: Compare both supplier hostnames from the proxy container
        if: always()
        run: |
          docker exec -i tiantian-api node - <<'JS'
          const axios = require('axios');
          const dns = require('node:dns').promises;
          const rank = require('./upstream/src/module/fundMNRank');
          const send = axios.getAdapter(axios.defaults.adapter);
          async function check() {
            for (const host of ['fundmobapi.eastmoney.com', 'fundmobapi.tiantianfunds.com']) {
              const started = Date.now();
              try {
                const addresses = await dns.lookup(host, { all: true });
                axios.defaults.adapter = (config) => send({ ...config, timeout: 8000,
                  url: config.url.replace('fundmobapi.eastmoney.com', host) });
                const result = await rank({ FundType: 31, pageIndex: 1, pageSize: 1 });
                console.log(JSON.stringify({ host, families: addresses.map(({ family }) => family),
                  elapsed_ms: Date.now() - started, success: result.Success, error_code: result.ErrCode,
                  rows: Array.isArray(result.Datas) ? result.Datas.length : null }));
              } catch (error) {
                console.log(JSON.stringify({ host, elapsed_ms: Date.now() - started,
                  error_code: error.code || 'unknown', upstream_status: error.response?.status ?? null }));
              }
            }
          }
          check().catch(() => { process.exitCode = 1; });
          JS
      - name: Show proxy request metadata
        if: always()
        run: docker logs --tail 50 tiantian-api
